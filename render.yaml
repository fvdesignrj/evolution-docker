# render.yaml
services:
  - type: web
    name: evolution-api
    runtime: docker
    plan: free                 # plano free do Render
    region: oregon             # região US West (Oregon)
    healthCheckPath: "/"       # GET / retorna JSON de boas-vindas
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_API_KEY
        sync: false            # você preenche manualmente no painel depois
      - key: DATABASE_ENABLED
        value: "false"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
