# render.yaml
services:
  - type: web
    name: evolution-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: "/"
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "8080"
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: DATABASE_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"

